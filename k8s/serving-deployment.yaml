# deployment for the model serving app, 2 replicas for availability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # always keep pods available during updates
  selector:
    matchLabels:
      app: model-serving
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
        - name: server
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CHECKPOINT_PATH
              value: /app/checkpoints/classifier_v1.pt
          # liveness = restart pod if this fails 3 times
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          # readiness = dont send traffic until this passes
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: checkpoints-volume
              mountPath: /app/checkpoints
              readOnly: true  # serving only needs to read the model
      volumes:
        - name: checkpoints-volume
          persistentVolumeClaim:
            claimName: checkpoints-pvc
